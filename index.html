<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atrapa la Pelota - Juego Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor principal donde ocurre toda la acción del juego -->
  <div id="game-container">
    <!-- Puntero virtual personalizado (para jugar fluido en computadora) -->
    <div id="custom-cursor"></div>

    <!-- Barra superior: Título del juego y botón para abrir el menú de pausa -->
    <div id="top-bar">
      <h1>Atrapa la Pelota</h1>
      <button id="pause-btn" onclick="togglePause()">⏸️</button>
    </div>
    
    <!-- Barra de información con la puntuación, el multiplicador de racha, récord y tiempo -->
    <div id="info-bar">
      <p>Puntos: <span id="score">0</span></p>
      <p id="streak-display" class="streak-hidden">Racha: <span id="multiplier-val">x1</span></p>
      <p>Récord: <span id="high-score">0</span></p>
      <p>Tiempo: <span id="timer">30</span>s</p>
    </div>

    <!-- La pelota principal que el jugador debe atrapar -->
    <div id="ball"></div>

    <!-- Menú de pausa flotante (permite cambiar ajustes sin perder la partida actual) -->
    <div id="pause-menu" class="hidden">
      <h2>Juego Pausado</h2>
      
      <!-- Selector de modos de juego / dificultad -->
      <div class="difficulty-group">
        <label>Nivel de Dificultad:</label>
        <div class="difficulty-buttons">
          <button id="btn-easy" class="diff-btn" onclick="changeDifficulty('easy')">Fácil</button>
          <button id="btn-medium" class="diff-btn active" onclick="changeDifficulty('medium')">Normal</button>
          <button id="btn-hard" class="diff-btn" onclick="changeDifficulty('hard')">Difícil</button>
        </div>
      </div>

      <!-- Ajuste dinámico de la duración de la partida -->
      <div class="control-group">
        <label>Ajustar Tiempo:</label>
        <div class="time-adjust-group">
          <button class="time-btn" onclick="adjustTime(-10)">-10s</button>
          <span id="menu-time-display">30s</span>
          <button class="time-btn" onclick="adjustTime(10)">+10s</button>
        </div>
      </div>

      <!-- Control deslizante para el volumen de los efectos de sonido -->
      <div class="control-group">
        <label for="volume-slider">Volumen del Audio:</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.3" oninput="changeVolume(this.value)">
      </div>

      <!-- Control de sensibilidad del cursor (exclusivo para PC) -->
      <div class="control-group" id="sensitivity-group">
        <label for="sensitivity-slider">Sensibilidad (PC): <span id="sens-value">1.0x</span></label>
        <input type="range" id="sensitivity-slider" min="0.3" max="2.0" step="0.1" value="1.0" oninput="changeSensitivity(this.value)">
      </div>

      <!-- Botones de acción dentro del menú de pausa -->
      <div class="menu-buttons">
        <button id="reset-highscore-btn" onclick="resetHighScore()">Borrar Récord</button>
        <button id="resume-btn" onclick="togglePause()">Seguir Jugando</button>
      </div>
    </div>

    <!-- Pantalla de Game Over (se muestra cuando el cronómetro llega a cero) -->
    <div id="game-over" class="hidden">
      <h2>¡Se Acabó el Tiempo!</h2>
      <p>Hiciste: <span id="final-score">0</span> puntos</p>
      <p>Tu mejor marca: <span id="final-high-score">0</span></p>
      <button id="restart-btn" onclick="restartGame()">Jugar otra vez</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
